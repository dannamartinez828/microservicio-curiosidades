# Blueprint de los 12 CRUD + 2 servicios de consulta resiliente.
# Render crea cada entrada como un servicio web independiente.
services:
  - type: web
    name: mascotas-nodejs-insertar
    runtime: docker
    plan: free
    rootDir: microservicio/nodejs/insertar
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SERVICE_NAME
        value: mascotas-nodejs-insertar
  - type: web
    name: mascotas-nodejs-actualizar
    runtime: docker
    plan: free
    rootDir: microservicio/nodejs/actualizar
    healthCheckPath: /health
