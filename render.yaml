# Blueprint de los 12 CRUD + 2 servicios de consulta resiliente.
# Cada entrada se despliega como un servicio web independiente.

services:

  # =========================
  # NODE.JS
  # =========================

  - type: web
    name: mascotas-nodejs-insertar
    runtime: docker
    plan: free
    rootDir: nodejs/insertar
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SERVICE_NAME
        value: mascotas-nodejs-insertar

  - type: web
    name: mascotas-nodejs-actualizar
    runtime: docker
    plan: free
    rootDir: nodejs/actualizar
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SERVICE_NAME
        value: mascotas-nodejs-actualizar

  - type: web
    name: mascotas-nodejs-eliminar
